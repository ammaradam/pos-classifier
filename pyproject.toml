# Workspace root — no [project] section; this file is NOT an installable package.
# uv resolves all members into a single uv.lock at this location.
#
# torch/torchvision are NOT in the workspace lock (dual CPU/GPU index conflict
# across members). Install torch separately per project:
#   CPU: uv pip install torch torchvision --index https://download.pytorch.org/whl/cpu
#   GPU: uv pip install torch torchvision==0.21.0 --index https://download.pytorch.org/whl/cu124
# In Docker the pytorch/pytorch base image provides torch pre-installed.

[tool.uv.workspace]
members = [
    "libs/ml-shared",
    "projects/pos-classifier",
    "projects/brand-detector",
]

# Run all project test suites from the repo root:
#   uv run pytest projects/pos-classifier projects/brand-detector
[tool.pytest.ini_options]
testpaths = ["projects/pos-classifier/tests", "projects/brand-detector/tests"]
addopts = "-v"
