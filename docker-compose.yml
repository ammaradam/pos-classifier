version: "3.9"

volumes:
  # Shared infra
  mlruns_data:
  prometheus_data:
  grafana_data:
  # pos-classifier
  pos_model_data:
  pos_db_data:
  # brand-detector
  bd_model_data:
  bd_db_data:

services:

  # ── Shared MLflow tracking server ─────────────────────────────────────────
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:latest
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
              "--backend-store-uri", "/app/mlruns",
              "--default-artifact-root", "/app/mlruns",
              "--allowed-hosts", "mlflow-server,localhost,127.0.0.1"]
    ports:
      - "5000:5000"
    volumes:
      - mlruns_data:/app/mlruns
    profiles: [train-pos, serve-pos, train-bd, serve-bd]

  # ══════════════════════════════════════════════════════════════════════════
  # pos-classifier services
  # Build context is the repo root so the Dockerfile can access libs/ml-shared.
  # ══════════════════════════════════════════════════════════════════════════

  pos-trainer:
    build:
      context: .
      dockerfile: projects/pos-classifier/Dockerfile
    image: pos-classifier:latest
    command: ["train"]
    volumes:
      - ./projects/pos-classifier/data:/app/data:ro
      - pos_model_data:/app/model
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - TRAIN_DATA_DIR=/app/data
      - TRAIN_MODEL_NAME=prajjwal1/bert-tiny
      - TRAIN_MAX_LENGTH=64
      - TRAIN_EPOCHS=5
      - TRAIN_BATCH_SIZE=64
      - TRAIN_EVAL_BATCH_SIZE=128
      - TRAIN_LR=2e-5
      - TRAIN_WEIGHT_DECAY=0.01
      - TRAIN_WARMUP_RATIO=0.1
      - TRAIN_PATIENCE=2
      - TRAIN_GRAD_ACCUM=1
      - TRAIN_USE_AMP=true
      - TRAIN_NUM_WORKERS=0
      - TRAIN_SUBSET=0
    depends_on: [mlflow-server]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: [train-pos]

  pos-api:
    build:
      context: .
      dockerfile: projects/pos-classifier/Dockerfile
    image: pos-classifier:latest
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - pos_db_data:/app/db
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: [serve-pos]

  pos-dashboard:
    build:
      context: .
      dockerfile: projects/pos-classifier/Dockerfile
    image: pos-classifier:latest
    command: ["monitor", "--port", "8501"]
    ports:
      - "8501:8501"
    volumes:
      - ./projects/pos-classifier/data:/app/data:ro
      - pos_db_data:/app/db
    depends_on: [pos-api]
    profiles: [serve-pos]

  # ══════════════════════════════════════════════════════════════════════════
  # brand-detector services
  # ══════════════════════════════════════════════════════════════════════════

  bd-trainer:
    build:
      context: .
      dockerfile: projects/brand-detector/Dockerfile
    image: brand-detector:latest
    command: ["train"]
    volumes:
      - ./projects/brand-detector/data:/app/data:ro
      - bd_model_data:/app/model
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - TRAIN_DATA_DIR=/app/data
    depends_on: [mlflow-server]
    profiles: [train-bd]

  bd-api:
    build:
      context: .
      dockerfile: projects/brand-detector/Dockerfile
    image: brand-detector:latest
    command: ["serve", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    volumes:
      - bd_db_data:/app/db
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: [serve-bd]

  bd-dashboard:
    build:
      context: .
      dockerfile: projects/brand-detector/Dockerfile
    image: brand-detector:latest
    command: ["monitor", "--port", "8502"]
    ports:
      - "8502:8502"
    volumes:
      - ./projects/brand-detector/data:/app/data:ro
      - bd_db_data:/app/db
    depends_on: [bd-api]
    profiles: [serve-bd]

  # ── Shared observability ──────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    profiles: [serve-pos, serve-bd]

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=
    depends_on: [prometheus]
    profiles: [serve-pos, serve-bd]
